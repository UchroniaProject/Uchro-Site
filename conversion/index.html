<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversion de fichier GeoJSON</title>
</head>
<body>
    <h1>Conversion de fichier GeoJSON</h1>
    <form action="upload.php" method="post" enctype="multipart/form-data">
        <label for="file">Sélectionnez un fichier GeoJSON :</label>
        <input type="file" name="file" id="file" accept=".geojson">
        <button type="submit">Télécharger et convertir</button>
    </form>
</body>
</html>
