<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Protégée</title>
</head>
<body>
  <h1>Page Protégée</h1>
  <p id="welcome-message">Bienvenue, </p>
  <button id="logoutButton">Se déconnecter</button>

  <script>
    // Fonction pour récupérer et afficher le pseudonyme de l'utilisateur
    async function displayUsername() {
      try {
        const response = await fetch('/user-info', {
          method: 'GET',
          credentials: 'include' // Inclure les cookies dans la requête
        });

        if (response.ok) {
          const userInfo = await response.json();
          document.getElementById('welcome-message').textContent = `Bienvenue, ${userInfo.username} !`;
        } else {
          const error = await response.text();
          console.error('Erreur :', error);
        }
      } catch (error) {
        console.error('Erreur :', error);
      }
    }

    // Vérifier l'authentification en envoyant une requête au serveur
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const response = await fetch('/protected', {
          method: 'GET',
          credentials: 'include' // Inclure les cookies dans la requête
        });

        if (!response.ok) {
          window.location.href = '/index.html';
        } else {
          await displayUsername(); // Afficher le pseudonyme de l'utilisateur
        }
      } catch (error) {
        console.error('Erreur :', error);
        window.location.href = '/index.html';
      }
    });

    // Ajouter un écouteur d'événement pour le bouton de déconnexion
    document.getElementById('logoutButton').addEventListener('click', async () => {
      try {
        const response = await fetch('/logout', {
          method: 'GET',
          credentials: 'include' // Inclure les cookies dans la requête
        });

        if (response.ok) {
          window.location.href = '/index.html';
        } else {
          const error = await response.text();
          alert('Erreur : ' + error);
        }
      } catch (error) {
        console.error('Erreur :', error);
        alert('Erreur : ' + error.message);
      }
    });
  </script>
</body>
</html>
