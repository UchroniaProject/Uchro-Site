<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversion GeoJSON</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="src/images/Logo-V4.png" />
</head>
<body>
    <header>
        <div class="container">
            <a href="/" class="logo-link">
                <img src="src/images/Logo-V4.png" alt="Logo d'Uchronia" class="logo" />
            </a>
            <h1>Conversion GeoJSON</h1>
            <p class="tagline">Convertissez vos fichiers GeoJSON facilement.</p>
        </div>
    </header>

    <section class="about">
        <div class="container">
            <form id="uploadForm">
                <label for="file">Sélectionnez un fichier GeoJSON :</label>
                <input type="file" name="file" id="file" accept=".geojson">
                <label for="mapName">Nom de la carte (max 32 caractères, sans espace) :</label>
                <input type="text" name="mapName" id="mapName" required pattern="[a-zA-Z0-9_]{1,32}" title="Nom de la carte (max 32 caractères, sans espace)">
                <button type="submit">Télécharger et convertir</button>
            </form>
            <div id="result"></div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2025 Uchronia. Tous droits réservés.</p>
        </div>
    </footer>

    <script src="https://unpkg.com/geojsonhint@latest/geojsonhint.js"></script>
    <script src="scripts/script_conversion.js"></script>
</body>
</html>
